name: CI Frontend - ARIA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verificar_lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
          cache: "npm"

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Ejecutar lint
        run: npm run lint

  compilar_frontend:
    runs-on: ubuntu-latest
    needs: verificar_lint

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
          cache: "npm"

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Verificar build
        run: npm run build
